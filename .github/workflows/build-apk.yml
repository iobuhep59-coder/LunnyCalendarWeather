name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Собрать Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Получить проект
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Сделать Gradle Wrapper исполняемым
        run: chmod +x ./gradlew

      - name: Собрать APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: lunny-calendar-weather-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
